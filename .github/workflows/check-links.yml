name: リンク切れの点検

# 毎週、公開中の事例の出典URLを開いて「正常・移転・拒否・要確認」に分け、/linkcheck.json に出す。
# サイトの掲載は自動では変えない（データ側の定期実行が linkcheck.json を読んで直す）。
on:
  schedule:
    - cron: "30 21 * * 0"   # 毎週月曜 6:30（日本時間）。観測所の点検とずらしています
  workflow_dispatch:

permissions:
  contents: write   # 結果（data/linkcheck.json）を保存するため
  issues: write     # 要確認があったときに Issue で知らせるため
  actions: write    # 結果を公開するために「サイトを更新」を動かすため

concurrency:
  group: linkcheck
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 出典URLを開いて確かめ、data/linkcheck.json に書く。要確認があれば report.md もできる
      - name: 出典URLを開いて確かめる
        run: python tools/check_links.py report.md

      - name: 結果を保存する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/linkcheck.json
          git diff --cached --quiet || git commit -m "リンク点検の結果 $(TZ=Asia/Tokyo date +%F)"
          # GitHub が一時的なエラーを返すことがあるので、30秒おきに3回まで試し直す
          for i in 1 2 3; do
            git pull --rebase -q && git push && exit 0
            echo "保存に失敗しました（${i}回目）。30秒後に試し直します"
            sleep 30
          done
          exit 1

      # サイトを作り直して linkcheck.json を公開する（掲載内容や見た目は変わらない）
      - name: 結果を公開する
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --repo "${{ github.repository }}" --ref main

      # 要確認があったときだけ Issue を作る。Issue ができるとアカウントのメールに通知が届く
      - name: 要確認があれば Issue で知らせる
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f report.md ]; then
            gh issue create --repo "${{ github.repository }}" \
              --title "リンク点検で要確認のURLがありました $(TZ=Asia/Tokyo date +%Y-%m-%d)" \
              --body-file report.md
          else
            echo "要確認のURLはありませんでした"
          fi
