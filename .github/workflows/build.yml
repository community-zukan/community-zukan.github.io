name: サイトを更新

on:
  schedule:
    - cron: "40 20 * * *"   # 毎日 5:40（日本時間）。観測所の更新とずらしています
  workflow_dispatch:
    inputs:
      force:
        description: "件数が急に減っても公開する"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: サイトを作る
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python build.py --force
          else
            python build.py
          fi
      - name: 使ったデータを記録する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.csv
          git diff --cached --quiet || git commit -m "データを更新" && git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
